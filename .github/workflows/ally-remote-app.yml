name: Ally Remote — gerar APK (Android)

on:
  push:
    branches: [ "main" ]
    paths:
      - "ally-remote-app/**"
      - ".github/workflows/ally-remote-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Compilar APK
        run: gradle -p ally-remote-app assembleDebug

      - name: Renomear APK
        run: cp ally-remote-app/app/build/outputs/apk/debug/app-debug.apk AllyRemote.apk

      - name: Guardar artefato (backup)
        uses: actions/upload-artifact@v4
        with:
          name: AllyRemote-apk
          path: AllyRemote.apk

      - name: Publicar na Release "allyremote-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: allyremote-latest
          name: "Ally Remote — última versão (build automático)"
          files: AllyRemote.apk
